<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<title>Server Dashboard</title>

<style>

body{
font-family:sans-serif;
margin:40px;
}

table{
border-collapse:collapse;
width:100%;
}

td,th{
border:1px solid #aaa;
padding:8px;
}

button{
cursor:pointer;
}

</style>

</head>

<body>

<h1>Server Dashboard</h1>

<input id="name" placeholder="Server Name">

<select id="status">
<option>ONLINE</option>
<option>OFFLINE</option>
</select>

<input id="cpu" type="number" placeholder="CPU">

<input id="memory" type="number" placeholder="Memory">

<button onclick="addServer()">
追加
</button>

<hr>

<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Status</th>
<th>CPU</th>
<th>Memory</th>
<th></th>

</tr>

</thead>

<tbody id="list">

</tbody>

</table>

<script>

async function loadServers(){

const res=await fetch("/api/servers");

const servers=await res.json();

const tbody=document.getElementById("list");

tbody.innerHTML="";

servers.forEach(server=>{

tbody.innerHTML+=`

<tr>

<td>${server.id}</td>

<td>${server.name}</td>

<td>${server.status}</td>

<td>${server.cpu_usage}%</td>

<td>${server.memory_usage}%</td>

<td>

<button onclick="deleteServer(${server.id})">

削除

</button>

</td>

</tr>

`;

});

}

async function addServer(){

await fetch("/api/servers",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:document.getElementById("name").value,

status:document.getElementById("status").value,

cpu_usage:Number(document.getElementById("cpu").value),

memory_usage:Number(document.getElementById("memory").value)

})

});

loadServers();

}

async function deleteServer(id){

await fetch("/api/servers/"+id,{

method:"DELETE"

});

loadServers();

}

loadServers();

</script>

</body>

</html>
